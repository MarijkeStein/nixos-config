source_directories:
    - /home

repositories:
    - path: /pub/backup/snapshots/borg/de-fra01-katjes
      label: de-fra01-katjes

exclude_caches: true
exclude_patterns:
    - '*/.cache'

encryption_passcommand: "cat /root/.borg-passphrase-katjes"

keep_daily: 90
keep_weekly: 52
keep_monthly: 120   # 10 years
keep_yearly: 20

checks:
  - name: repository
    frequency: 2 weeks
  - name: archives
    frequency: 1 month

check_last: 3

